<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandDraw</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <div id="app">
    <video id="input_video" playsinline style="display:none;"></video>
    <canvas id="video_canvas"></canvas>
    <canvas id="draw_canvas"></canvas>
    <div id="controls">
      <button id="btn-vid">VID</button>
      <button id="btn-clear">CLR</button>
      <button id="btn-color">COL</button>
      <button id="btn-thick">THK</button>
      <button id="btn-sample">SMP</button>
    </div>
    <input type="color" id="color-left" class="color-picker" value="#ffffff">
    <input type="color" id="color-right" class="color-picker" value="#003366">
    <div id="debug"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
